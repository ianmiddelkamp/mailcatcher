name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        env:
          MAILCATCHER_DB_PATH: ${{ github.workspace }}/target/test-data/mailcatcher
          MAILCATCHER_ATTACHMENTS_DIR: ${{ github.workspace }}/target/test-data/attachments
        run: |
          chmod +x mvnw
          ./mvnw -B test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ianmiddelkamp/mailcatcher
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mailcatcher:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container starts healthy
        run: |
          docker run -d --name smoke-test -p 8091:8091 mailcatcher:smoke-test
          echo "Waiting for container to report healthy..."
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' smoke-test)
            echo "  [$i] status=$status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs smoke-test
              exit 1
            fi
            sleep 2
          done
          echo "Container did not become healthy in time"
          docker logs smoke-test
          exit 1

      - name: Smoke test cleanup
        if: always()
        run: docker rm -f smoke-test || true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
