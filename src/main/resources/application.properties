spring.application.name=mailcatcher

server.port=${MAILCATCHER_PORT:8091}

spring.datasource.url=jdbc:h2:file:${MAILCATCHER_DB_PATH:/data/mailcatcher};AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

mailcatcher.attachments-dir=${MAILCATCHER_ATTACHMENTS_DIR:/data/attachments}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
