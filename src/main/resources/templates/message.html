<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${message.subject}">Message</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; max-width: 900px; }
        a.back { color: #1a5fb4; text-decoration: none; font-size: 0.9rem; }
        h1 { font-size: 1.25rem; }
        dl { display: grid; grid-template-columns: 6rem 1fr; row-gap: 0.25rem; font-size: 0.9rem; margin: 1rem 0; }
        dt { color: #666; }
        .body-frame { width: 100%; min-height: 400px; border: 1px solid #ddd; border-radius: 6px; margin-top: 1rem; background: #fff; }
        .attachments { margin-top: 1rem; }
        .attachments li { font-size: 0.9rem; }
        .toolbar { display: flex; justify-content: space-between; align-items: baseline; }
        .delete-btn { background: none; border: 1px solid #b91c1c; color: #b91c1c; border-radius: 4px; padding: 0.3rem 0.6rem; font-size: 0.85rem; cursor: pointer; }
        .delete-btn:hover { background: #fef2f2; }
    </style>
</head>
<body>
<div class="toolbar">
    <a class="back" href="/">&larr; back</a>
    <form th:action="@{'/message/' + ${message.id} + '/delete'}" method="post" onsubmit="return confirm('Delete this message?');">
        <button type="submit" class="delete-btn">Delete</button>
    </form>
</div>
<h1 th:text="${message.subject}"></h1>

<dl>
    <dt>Time</dt><dd th:text="${message.createdAt}"></dd>
    <dt>Endpoint</dt><dd th:text="${message.endpointLabel}"></dd>
    <dt>From</dt><dd th:text="${message.senderName} + ' &lt;' + ${message.senderHandle} + '&gt;'"></dd>
    <dt>To</dt><dd th:text="${message.toAddresses}"></dd>
    <dt>Cc</dt><dd th:text="${message.ccAddresses}"></dd>
    <dt>Bcc</dt><dd th:text="${message.bccAddresses}"></dd>
    <dt>Tags</dt><dd th:text="${message.tags}"></dd>
</dl>

<iframe class="body-frame" sandbox th:srcdoc="${message.body}"></iframe>
<script>
    // Auto-grow the sandboxed body iframe to fit its content, since it has no layout relationship
    // to the parent page's flow.
    document.querySelector('.body-frame').addEventListener('load', function () {
        var doc = this.contentDocument;
        if (doc && doc.body) {
            this.style.height = doc.body.scrollHeight + 32 + 'px';
        }
    });
</script>

<div class="attachments" th:unless="${#lists.isEmpty(message.attachments)}">
    <strong>Attachments</strong>
    <ul>
        <li th:each="a : ${message.attachments}">
            <a th:href="@{'/attachment/' + ${a.id}}" th:text="${a.filename} + ' (' + ${a.size} + ' bytes)'"></a>
        </li>
    </ul>
</div>
</body>
</html>
