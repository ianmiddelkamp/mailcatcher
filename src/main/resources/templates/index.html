<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Mailcatcher</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
        h1 { font-size: 1.25rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
        th { color: #666; font-weight: 600; }
        tr:hover { background: #f7f7f7; }
        a { color: #1a5fb4; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .empty { color: #888; padding: 2rem 0; }
        .tag { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 4px; padding: 0.1rem 0.4rem; font-size: 0.75rem; margin-right: 0.25rem; }
        .toolbar { display: flex; justify-content: space-between; align-items: baseline; }
        .delete-btn { background: none; border: none; color: #b91c1c; cursor: pointer; font-size: 0.85rem; padding: 0; }
        .delete-btn:hover { text-decoration: underline; }
        .delete-all { background: none; border: 1px solid #b91c1c; color: #b91c1c; border-radius: 4px; padding: 0.3rem 0.6rem; font-size: 0.85rem; cursor: pointer; }
        .delete-all:hover { background: #fef2f2; }
    </style>
</head>
<body>
<div class="toolbar">
    <h1>Mailcatcher — captured outbound mail</h1>
    <form th:unless="${#lists.isEmpty(messages)}" method="post" action="/messages/delete-all"
          onsubmit="return confirm('Delete all captured messages?');">
        <button type="submit" class="delete-all">Delete all</button>
    </form>
</div>

<p th:if="${#lists.isEmpty(messages)}" class="empty">Nothing captured yet.</p>

<table th:unless="${#lists.isEmpty(messages)}">
    <thead>
    <tr>
        <th>Time</th>
        <th>Endpoint</th>
        <th>From</th>
        <th>To</th>
        <th>Subject</th>
        <th>Tags</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="m : ${messages}">
        <td th:text="${m.createdAt}"></td>
        <td th:text="${m.endpointLabel}"></td>
        <td th:text="${m.senderName ?: m.senderHandle}"></td>
        <td th:text="${m.toAddresses}"></td>
        <td><a th:href="@{'/message/' + ${m.id}}" th:text="${m.subject}"></a></td>
        <td>
            <span class="tag" th:each="t : ${m.tagList}" th:text="${t}"></span>
        </td>
        <td>
            <form th:action="@{'/message/' + ${m.id} + '/delete'}" method="post" onsubmit="return confirm('Delete this message?');">
                <button type="submit" class="delete-btn">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
